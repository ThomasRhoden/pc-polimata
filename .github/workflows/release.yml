name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (e.g. v0.5.0)"
        required: true

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ".[pdf,memory,tray,windows]" pyinstaller
      - name: Build (PyInstaller, folder + single file)
        shell: pwsh
        run: |
          pyinstaller packaging/pc_polimata.spec --clean --noconfirm
          $env:PC_POLIMATA_ONEFILE = "1"
          pyinstaller packaging/pc_polimata.spec --noconfirm --distpath dist-onefile --workpath build-onefile
      - name: Smoke test
        shell: pwsh
        run: |
          $exe = "dist/PCPolimata/pc-polimata.exe"
          $version = & $exe --version
          Write-Host $version
          if ($LASTEXITCODE -ne 0) { throw "--version failed" }
          $expected = "$env:TAG".TrimStart("v")
          if ($version -notmatch [regex]::Escape($expected)) { throw "version mismatch: $version (expected $expected)" }
          & $exe --report --plugins -o smoke-report.json
          if ($LASTEXITCODE -ne 0) { throw "--report failed" }
          $report = Get-Content smoke-report.json -Raw | ConvertFrom-Json
          if (-not $report.system.cpu) { throw "report has no CPU section" }
          Write-Host "CPU: $($report.system.cpu.name)"
          # GUI exes must be windowed (PE subsystem 2): no CMD window on double-click
          python packaging/pe_subsystem.py "dist/PCPolimata/PC Polimata.exe" 2
          if ($LASTEXITCODE -ne 0) { throw "onedir GUI exe is not windowed" }
          python packaging/pe_subsystem.py "dist-onefile/PC Polimata.exe" 2
          if ($LASTEXITCODE -ne 0) { throw "onefile exe is not windowed" }
          # windowed exe has no stdout: check that the CLI still works and writes the file
          $p = Start-Process -FilePath "dist-onefile/PC Polimata.exe" -ArgumentList "--report","-o","smoke-onefile.json" -Wait -PassThru
          if ($p.ExitCode -ne 0 -or -not (Test-Path smoke-onefile.json)) { throw "onefile --report failed ($($p.ExitCode))" }
          $p = Start-Process -FilePath "dist/PCPolimata/PC Polimata.exe" -ArgumentList "--report","-o","smoke-gui.json" -Wait -PassThru
          if ($p.ExitCode -ne 0 -or -not (Test-Path smoke-gui.json)) { throw "windowed --report failed ($($p.ExitCode))" }
      - name: Package
        shell: pwsh
        run: |
          $name = "pc-polimata-$env:TAG-windows-x64"
          Rename-Item dist/PCPolimata "PC Polimata"
          Compress-Archive -Path "dist/PC Polimata" -DestinationPath "$name.zip"
          Copy-Item smoke-report.json "$name-smoke-report.json"
          Copy-Item "dist-onefile/PC Polimata.exe" "$name.exe"
      - name: Attach to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $name = "pc-polimata-$env:TAG-windows-x64"
          $notes = @"
          Windows: baixe **$name.zip** (recomendado, abre mais rápido), extraia e rode ``PC Polimata.exe``.
          Alternativa: **$name.exe** (arquivo único, sem instalação; mais lento para abrir).
          ``pc-polimata.exe`` dentro do zip é a versão de linha de comando (--report, --version).
          Executável não assinado: o SmartScreen pode avisar (Mais informações > Executar assim mesmo).
          "@
          Set-Content release-notes.md $notes
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -ne 0) { gh release create $env:TAG --title "PC Polimata $env:TAG" --notes-file release-notes.md }
          gh release upload $env:TAG "$name.zip" "$name.exe" "$name-smoke-report.json" --clobber
