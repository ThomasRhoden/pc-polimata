[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pc-polimata"
version = "0.1.0"
description = "Diagnóstico e benchmark de hardware para desktop, em Python"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Thomas Gonçalves" }]
requires-python = ">=3.10"
dependencies = ["psutil>=5.9", "py-cpuinfo>=9.0", "customtkinter>=5.2"]

[project.optional-dependencies]
gpu = ["nvidia-ml-py>=12.0"]
windows = ["wmi>=1.5; sys_platform == 'win32'"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
pc-polimata = "pc_polimata.cli:main"

[tool.setuptools.packages.find]
include = ["pc_polimata*"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
