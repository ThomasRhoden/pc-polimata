[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pc-polimata"
version = "0.2.0"
description = "Diagnóstico e benchmark de hardware para desktop, em Python"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Thomas Gonçalves" }]
requires-python = ">=3.10"
dependencies = ["psutil>=5.9", "py-cpuinfo>=9.0", "customtkinter>=5.2"]

[project.optional-dependencies]
gpu = ["nvidia-ml-py>=12.0"]
memory = ["numpy>=1.24"]
pdf = ["reportlab>=4.0"]
windows = ["wmi>=1.5; sys_platform == 'win32'"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "mypy>=1.10", "types-psutil"]

[project.scripts]
pc-polimata = "pc_polimata.cli:main"

[project.urls]
Homepage = "https://github.com/ThomasRhoden/pc-polimata"
Issues = "https://github.com/ThomasRhoden/pc-polimata/issues"
Changelog = "https://github.com/ThomasRhoden/pc-polimata/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["pc_polimata*"]

[tool.setuptools.package-data]
"pc_polimata.data" = ["*.json", "*.css"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint.per-file-ignores]
"pc_polimata/i18n.py" = ["E501"]

[tool.mypy]
python_version = "3.10"
files = ["pc_polimata/core", "pc_polimata/i18n.py"]
strict = true
warn_unused_ignores = true
# dependências opcionais sem stubs
[[tool.mypy.overrides]]
module = ["cpuinfo", "GPUtil", "pynvml", "wmi", "reportlab.*", "numpy"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["pc_polimata"]
omit = ["pc_polimata/gui/*", "pc_polimata/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
